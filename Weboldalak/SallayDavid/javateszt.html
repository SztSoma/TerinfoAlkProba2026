<!DOCTYPE html>
<html>
<body>

<h1>My First JavaScript</h1>

<p>A JavaScript képes megváltoztatni egy HTML tartalmát:</p>

<button type="button" onclick="myFunction()">Kattints rám!</button>

<p id="demo">Ez egy bemutató.</p>

<script>
function myFunction() { 
  document.getElementById("demo").innerHTML = "Hello JavaScript!";
}
</script>

</body>
</html>
